name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .[test]
      - name: Check generated contracts and coverage
        run: python tools/repository_checks.py
      - name: Run complete test suite
        run: python -m pytest -q
